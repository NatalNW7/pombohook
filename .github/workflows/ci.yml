name: CI Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'scripts/**'
      - '.github/workflows/cd.yml'
      - '.goreleaser.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'scripts/**'
      - '.github/workflows/cd.yml'
      - '.goreleaser.yml'

permissions:
  contents: read

jobs:
  build-test-coverage:
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    name: Build, Test & Coverage (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.21', '1.24', '1.26']
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Check Coverage
        run: |
          make coverage
          COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "Total Coverage: ${COVERAGE}%"
          if awk "BEGIN {exit !($COVERAGE < 80.0)}"; then
            echo "::error::Coverage ($COVERAGE%) is below the minimum required (80.0%)"
            exit 1
          fi
          echo "Coverage is acceptable ($COVERAGE%)."

  security-gates:
    name: Security Gates
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    uses: ./.github/workflows/security.yml

  pr-checks:
    name: Verify All Checks Passed
    runs-on: ubuntu-latest
    needs: [build-test-coverage, security-gates]
    if: always()
    steps:
      - name: Check if any checks failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') 
        run: |
          echo "One or more checks failed"
          exit 1
      - name: All checks passed
        run: echo "All PR checks passed successfully!"
