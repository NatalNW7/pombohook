name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test-coverage:
    name: Build, Test & Coverage (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.21', '1.24', '1.26']
    
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Check Coverage
        run: |
          make coverage
          COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/ {print substr($3, 1, length($3)-1)}')
          echo "Total Coverage: ${COVERAGE}%"
          if awk "BEGIN {exit !($COVERAGE < 80.0)}"; then
            echo "::error::Coverage ($COVERAGE%) is below the minimum required (80.0%)"
            exit 1
          fi
          echo "Coverage is acceptable ($COVERAGE%)."
